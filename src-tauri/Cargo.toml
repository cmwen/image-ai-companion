[package]
name = "image-ai-companion"
version = "0.1.1"
description = "A local-first companion for learning AI image direction"
authors = ["Image AI Companion contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "image_ai_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
